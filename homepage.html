<!DOCTYPE html>
<html lang="en" data-theme="medieval">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Scriptorium – A Word for Every Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+English:ital@0;1&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("scriptorium-theme");if(t==="glass"||t==="medieval")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="medieval"]{
  --bg:radial-gradient(ellipse at 50% 0%,#ead9b0,#dcc693); --ink:#2b1d12; --head:#6e1a1a; --sub:#1f3a6b; --line:#5a3d1c; --gilt:#9a7420;
  --panel:rgba(255,248,225,.16); --pborder:3px double #5a3d1c; --rad:0; --pshadow:0 10px 30px rgba(60,35,10,.35); --blur:none; --outline:1px solid #9a7420;
  --chip:radial-gradient(circle at 35% 30%,#a02a2a,#6e1a1a 70%); --chip-on:#4c1010; --chipink:#f6e8c8; --chipborder:2px solid #3d0d0d;
  --chiprad:2.2rem 2.4rem 2.1rem 2.5rem / 2.4rem 2.1rem 2.5rem 2.2rem; --chipshadow:0 3px 0 #3d0d0d,0 6px 10px rgba(60,35,10,.35); --ring:#9a7420;
  --vborder:2px solid #5a3d1c; --vleft:10px solid #1f3a6b; --vbg:rgba(255,248,225,.2); --vrad:0;
  --swon:#6e1a1a; --swonink:#f6e8c8; --focus:#1f3a6b;
  --body:"IM Fell English","Palatino Linotype",Palatino,Georgia,serif; --disp:"UnifrakturCook","Old English Text MT",Georgia,serif; --dispw:700; --lh:1.7;
}
:root[data-theme="glass"]{
  --bg:radial-gradient(circle at 12% 18%,#7c5cff 0,transparent 42%),radial-gradient(circle at 88% 12%,#00c8ff 0,transparent 38%),radial-gradient(circle at 72% 92%,#ff5fa2 0,transparent 42%),radial-gradient(circle at 10% 90%,#2bd9a0 0,transparent 30%),#0b1030;
  --ink:#f4f7ff; --head:#ffffff; --sub:#cfe0ff; --line:rgba(255,255,255,.35); --gilt:rgba(255,255,255,.5);
  --panel:rgba(255,255,255,.1); --pborder:1px solid rgba(255,255,255,.28); --rad:1.75rem; --pshadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.35); --blur:blur(26px) saturate(170%); --outline:none;
  --chip:rgba(255,255,255,.12); --chip-on:rgba(255,255,255,.34); --chipink:#fff; --chipborder:1px solid rgba(255,255,255,.3);
  --chiprad:999px; --chipshadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.22); --ring:#ffffff;
  --vborder:1px solid rgba(255,255,255,.3); --vleft:1px solid rgba(255,255,255,.3); --vbg:rgba(255,255,255,.12); --vrad:1.25rem;
  --swon:rgba(255,255,255,.3); --swonink:#fff; --focus:#ffffff;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --disp:"Outfit",system-ui,sans-serif; --dispw:600; --lh:1.6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);background-attachment:fixed;font-family:var(--body);font-size:1.1rem;line-height:var(--lh);display:flex;align-items:center}
.page{width:100%;max-width:72rem;margin:0 auto;padding:1.5rem 1.5rem 2rem}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem 2rem;flex-wrap:wrap;margin-bottom:1.5rem}
h1{font-family:var(--disp);font-weight:var(--dispw);font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05;margin:0;color:var(--head)}
[data-theme="medieval"] h1{text-shadow:1px 1px 0 var(--gilt)}
.cross{display:none;color:var(--head);font-size:1.6rem;margin-right:.6rem;vertical-align:.15em}
[data-theme="medieval"] .cross{display:inline}
.tag{margin:.4rem 0 0;max-width:34rem;font-style:italic}
[data-theme="glass"] .tag{font-style:normal;font-weight:300;opacity:.9}
.switch{display:flex;border:1px solid var(--line);border-radius:var(--chiprad);padding:3px;gap:3px;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
[data-theme="medieval"] .switch{border-radius:0}
.opt{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:0;padding:.35rem .95rem;cursor:pointer;border-radius:inherit}
.opt[aria-pressed="true"]{background:var(--swon);color:var(--swonink)}
.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.75rem;align-items:stretch}
.panel{padding:1.75rem;background:var(--panel);border:var(--pborder);border-radius:var(--rad);box-shadow:var(--pshadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);outline:var(--outline);outline-offset:5px}
h2{font-family:var(--disp);font-weight:var(--dispw);font-size:1.7rem;line-height:1.2;margin:0 0 .15rem;color:var(--sub)}
.sub{margin:0 0 1.1rem;font-style:italic}
[data-theme="glass"] .sub{font-style:normal;font-weight:300;opacity:.85}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.7rem}
.chip{font:inherit;color:var(--chipink);cursor:pointer;text-align:center;background:var(--chip);border:var(--chipborder);border-radius:var(--chiprad);padding:.65rem .5rem;box-shadow:var(--chipshadow);transition:transform .12s,background .2s}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--chip-on);outline:2px solid var(--ring);outline-offset:2px}
.chip:focus-visible,.go:focus-visible,.again:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.or{margin:1.25rem 0 .5rem;font-style:italic}
[data-theme="glass"] .or{font-style:normal;font-weight:300;opacity:.85}
.say{display:flex;gap:.6rem;flex-wrap:wrap}
input{flex:1 1 12rem;font:inherit;color:var(--ink);background:rgba(255,250,235,.3);border:0;border-bottom:2px solid var(--line);padding:.55rem .7rem;border-radius:0}
[data-theme="glass"] input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:.55rem 1.1rem}
input::placeholder{color:var(--ink);opacity:.55;font-style:italic}
.go,.again{font:inherit;cursor:pointer;color:var(--ink);background:transparent;border:2px solid var(--gilt);padding:.45rem 1.2rem}
[data-theme="medieval"] .go,[data-theme="medieval"] .again{border-radius:.2rem;box-shadow:inset 0 0 0 2px #dcc693,inset 0 0 0 3px var(--line)}
[data-theme="glass"] .go,[data-theme="glass"] .again{border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);color:#fff}
.go:hover,.again:hover{background:rgba(154,116,32,.2)}
[data-theme="glass"] .go:hover,[data-theme="glass"] .again:hover{background:rgba(255,255,255,.32)}
.right{display:flex;flex-direction:column;justify-content:center;min-height:22rem}
.empty{margin:auto;text-align:center;font-style:italic;max-width:18rem;opacity:.8}
[data-theme="glass"] .empty{font-style:normal;font-weight:300}
.verse{padding:1.75rem 1.6rem 1.4rem;background:var(--vbg);border:var(--vborder);border-left:var(--vleft);border-radius:var(--vrad);animation:in .45s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.verse{animation:none}.chip{transition:none}}
.feel{margin:0 0 .75rem;font-style:italic;color:var(--sub)}
[data-theme="glass"] .feel{font-style:normal;font-weight:600;font-size:.9rem;letter-spacing:.04em}
.text{margin:0;font-size:clamp(1.25rem,2.2vw,1.65rem);line-height:1.7}
[data-theme="glass"] .text{font-weight:300}
[data-theme="medieval"] .text::first-letter{font-family:var(--disp);float:left;font-size:4.4rem;line-height:.8;padding:.35rem .5rem 0 0;color:var(--head);text-shadow:1px 1px 0 var(--gilt)}
.ref{margin:1rem 0 0;text-align:right;font-style:italic;color:var(--head)}
[data-theme="glass"] .ref{font-style:normal;font-weight:600}
.ref::before{content:"\2014\00a0"}
.actions{margin-top:1rem;text-align:right}
.note{margin:1.25rem 0 0;text-align:center;font-size:.92rem;font-style:italic;opacity:.85}
[data-theme="glass"] .note{font-style:normal;font-weight:300}
@media (max-width:52rem){.stage{grid-template-columns:1fr}.right{min-height:14rem}body{align-items:flex-start}}
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1><span class="cross" aria-hidden="true">✠</span>The Scriptorium</h1>
      <p class="tag" data-k="tag"></p>
    </div>
    <div class="switch" role="group" aria-label="Theme">
      <button class="opt" type="button" data-theme-btn="medieval" aria-pressed="true">Medieval</button>
      <button class="opt" type="button" data-theme-btn="glass" aria-pressed="false">Liquid glass</button>
    </div>
  </header>

  <main class="stage">
    <section class="panel">
      <h2 data-k="ask"></h2>
      <p class="sub" data-k="sub"></p>
      <div class="chips" id="chips" role="group" aria-label="Choose a mood"></div>
      <p class="or" data-k="or"></p>
      <div class="say">
        <input id="free" type="text" aria-label="Describe how you feel" autocomplete="off">
        <button class="go" id="go" type="button" data-k="go"></button>
      </div>
    </section>

    <section class="panel right" id="out" aria-live="polite"></section>
  </main>

  <p class="note" data-k="note"></p>
</div>

<script>
const MOODS = {
  anxious:{m:"Anxious",g:"Anxious",lm:"For the troubled mind",words:["anxious","anxiety","worried","worry","nervous","stress","stressed","overwhelmed","panic","uneasy"],v:[
    ["Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.","Philippians 4:6"],
    ["Casting all your care upon him; for he careth for you.","1 Peter 5:7"],
    ["Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.","Matthew 6:34"]]},
  sad:{m:"Sorrowful",g:"Sad",lm:"For the sorrowing heart",words:["sad","sorrow","grief","grieving","cry","crying","depressed","down","hurt","heartbroken","loss","mourning"],v:[
    ["The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","Psalm 34:18"],
    ["For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.","Psalm 30:5"],
    ["Blessed are they that mourn: for they shall be comforted.","Matthew 5:4"]]},
  joyful:{m:"Joyful",g:"Joyful",lm:"For the glad of heart",words:["happy","joy","joyful","glad","excited","great","good","cheerful","wonderful"],v:[
    ["This is the day which the LORD hath made; we will rejoice and be glad in it.","Psalm 118:24"],
    ["Rejoice in the Lord alway: and again I say, Rejoice.","Philippians 4:4"],
    ["Neither be ye sorry; for the joy of the LORD is your strength.","Nehemiah 8:10"]]},
  angry:{m:"Wrathful",g:"Angry",lm:"For the burning spirit",words:["angry","anger","mad","furious","rage","annoyed","frustrated","bitter","resentful","irritated"],v:[
    ["Be ye angry, and sin not: let not the sun go down upon your wrath.","Ephesians 4:26"],
    ["A soft answer turneth away wrath: but grievous words stir up anger.","Proverbs 15:1"],
    ["Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath.","James 1:19"]]},
  lonely:{m:"Lonely",g:"Lonely",lm:"For the heart that is alone",words:["lonely","alone","isolated","abandoned","forgotten","rejected","unloved","left out"],v:[
    ["And the LORD, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","Deuteronomy 31:8"],
    ["God setteth the solitary in families.","Psalm 68:6"],
    ["And, lo, I am with you alway, even unto the end of the world.","Matthew 28:20"]]},
  afraid:{m:"Fearful",g:"Afraid",lm:"For the fearful soul",words:["afraid","fear","scared","frightened","terrified","dread","fearful","unsafe"],v:[
    ["Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee.","Isaiah 41:10"],
    ["Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me.","Psalm 23:4"],
    ["For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.","2 Timothy 1:7"]]},
  weary:{m:"Weary",g:"Tired",lm:"For the weary traveller",words:["tired","weary","exhausted","burnt","burned","drained","fatigued","sleepy","worn"],v:[
    ["Come unto me, all ye that labour and are heavy laden, and I will give you rest.","Matthew 11:28"],
    ["But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary.","Isaiah 40:31"],
    ["And let us not be weary in well doing: for in due season we shall reap, if we faint not.","Galatians 6:9"]]},
  hopeful:{m:"Hopeful",g:"Hopeful",lm:"For the heart that waiteth",words:["hope","hopeful","hoping","optimistic","waiting","looking forward","uncertain","lost"],v:[
    ["For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","Jeremiah 29:11"],
    ["Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope.","Romans 15:13"],
    ["Be of good courage, and he shall strengthen your heart, all ye that hope in the LORD.","Psalm 31:24"]]},
  grateful:{m:"Thankful",g:"Grateful",lm:"For the thankful heart",words:["grateful","thankful","thanks","appreciate","blessed","gratitude"],v:[
    ["In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","1 Thessalonians 5:18"],
    ["O give thanks unto the LORD, for he is good: for his mercy endureth for ever.","Psalm 107:1"],
    ["Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.","Psalm 100:4"]]},
  guilty:{m:"Repentant",g:"Guilty",lm:"For the burdened conscience",words:["guilty","guilt","ashamed","shame","sorry","regret","sinned","sin","repent","failed"],v:[
    ["If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.","1 John 1:9"],
    ["As far as the east is from the west, so far hath he removed our transgressions from us.","Psalm 103:12"],
    ["There is therefore now no condemnation to them which are in Christ Jesus.","Romans 8:1"]]}
};
const COPY = {
  medieval:{tag:"Tell the scribe how thy heart doth fare, and receive a verse from Holy Scripture to keep thee company.",ask:"How fareth thy heart today?",sub:"Press a seal to choose thy mood.",or:"or write it in thine own words",go:"Seek a verse",empty:"Thy verse shall appear upon this scroll.",again:"Another verse",ph:"I feel overwhelmed and tired…",note:"Verses are from the King James Version. Read the whole passage in thine own Bible for its full meaning."},
  glass:{tag:"Tell us how you feel and get a Bible verse that fits the moment.",ask:"How are you feeling today?",sub:"Pick a mood.",or:"or describe it in your own words",go:"Find a verse",empty:"Your verse will appear here.",again:"Another verse",ph:"I feel overwhelmed and tired…",note:"Verses are from the King James Version. Read the full passage in your own Bible for its full meaning."}
};
const root = document.documentElement, chips = document.getElementById("chips"), out = document.getElementById("out"),
      free = document.getElementById("free"), last = {};
let current = null;
const theme = () => root.dataset.theme;

Object.keys(MOODS).forEach(key => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.key = key; b.setAttribute("aria-pressed","false");
  b.addEventListener("click", () => show(key));
  chips.appendChild(b);
});

function applyCopy(){
  const c = COPY[theme()];
  document.querySelectorAll("[data-k]").forEach(el => el.textContent = c[el.dataset.k]);
  free.placeholder = c.ph;
  document.querySelectorAll(".chip").forEach(b => b.textContent = theme()==="glass" ? MOODS[b.dataset.key].g : MOODS[b.dataset.key].m);
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === theme())));
  if (current) show(current, true); else renderEmpty();
}
function renderEmpty(){
  out.innerHTML = ""; const p = document.createElement("p"); p.className = "empty"; p.textContent = COPY[theme()].empty; out.appendChild(p);
}
function pick(key){
  const list = MOODS[key].v; let i;
  do { i = Math.floor(Math.random()*list.length); } while (list.length > 1 && i === last[key]);
  last[key] = i; return list[i];
}
function show(key, keep){
  current = key;
  document.querySelectorAll(".chip").forEach(s => s.setAttribute("aria-pressed", String(s.dataset.key === key)));
  const [text, ref] = keep && last[key] !== undefined ? MOODS[key].v[last[key]] : pick(key);
  out.innerHTML = "";
  const box = document.createElement("div"); box.className = "verse";
  const f = document.createElement("p"); f.className = "feel";
  f.textContent = theme()==="glass" ? "Feeling " + MOODS[key].g.toLowerCase() : MOODS[key].lm + ":";
  const t = document.createElement("p"); t.className = "text"; t.textContent = text;
  const r = document.createElement("p"); r.className = "ref"; r.textContent = ref;
  const a = document.createElement("div"); a.className = "actions";
  const again = document.createElement("button"); again.type = "button"; again.className = "again"; again.textContent = COPY[theme()].again;
  again.addEventListener("click", () => show(key));
  a.appendChild(again); box.append(f, t, r, a); out.appendChild(box);
  if (!keep && innerWidth <= 832) box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest"});
}
function seek(){
  const q = free.value.toLowerCase().trim();
  if (!q) { free.focus(); return; }
  let best = null, score = 0;
  for (const [key, m] of Object.entries(MOODS)) {
    const s = m.words.reduce((n, w) => n + (q.includes(w) ? 1 : 0), 0);
    if (s > score) { score = s; best = key; }
  }
  if (!best) { const keys = Object.keys(MOODS); best = keys[Math.floor(Math.random()*keys.length)]; }
  show(best);
}
document.getElementById("go").addEventListener("click", seek);
free.addEventListener("keydown", e => { if (e.key === "Enter") seek(); });
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => {
  root.dataset.theme = b.dataset.themeBtn;
  try { localStorage.setItem("scriptorium-theme", root.dataset.theme); } catch (e) {}
  applyCopy();
}));
applyCopy();
</script>
</body>
</html>
